[package]
name = "penelope-machine-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]

[dependencies]
penelope = { path = "../../crates/penelope" }
penelope-sqlite = { path = "../../crates/penelope-sqlite", optional = true }
async-trait = { version = "0.1", optional = true }
tempfile = { version = "3", optional = true }
penelope-process-runtime = { path = "../../crates/penelope-process-runtime", optional = true }

[features]
durable = ["dep:penelope-sqlite", "dep:async-trait", "dep:tempfile"]
timeline = ["penelope/timeline"]
protected = ["durable", "dep:penelope-process-runtime"]

[[bin]]
name = "flat"
path = "../../crates/penelope/examples/counter_machine.rs"

[[bin]]
name = "nested"
path = "../../crates/penelope/examples/nested_order.rs"

[[bin]]
name = "decisions"
path = "../../crates/penelope/examples/prepared_decisions.rs"

[[bin]]
name = "timeline"
path = "../../crates/penelope/examples/timeline_machine.rs"
required-features = ["timeline"]

[[bin]]
name = "durable"
path = "durable.rs"
required-features = ["durable"]

[[bench]]
name = "native_pipeline"
path = "native_pipeline.rs"
harness = false
required-features = ["protected"]
