[package]
name = "penelope-machine-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]

[dependencies]
penelope = { path = "../../crates/penelope" }

[features]
timeline = ["penelope/timeline"]

[[bin]]
name = "flat"
path = "../../crates/penelope/examples/counter_machine.rs"

[[bin]]
name = "nested"
path = "../../crates/penelope/examples/nested_order.rs"

[[bin]]
name = "decisions"
path = "../../crates/penelope/examples/prepared_decisions.rs"

[[bin]]
name = "timeline"
path = "../../crates/penelope/examples/timeline_machine.rs"
required-features = ["timeline"]
