[package]
name = "penelope-compat-04"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]

[features]
default = []
timeline = ["penelope/timeline"]

[dependencies]
penelope = { path = "../../crates/penelope" }
serde_json = "1"

[[bin]]
name = "protocols"
path = "src/protocols.rs"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
