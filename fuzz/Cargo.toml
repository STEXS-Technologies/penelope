[package]
name = "penelope-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = { workspace = true }

[dependencies.penelope-domain]
path = "../crates/penelope-domain"

[dependencies.penelope-executor]
path = "../crates/penelope-executor"

[dependencies.penelope-statechronicle]
path = "../crates/penelope-statechronicle"

[dependencies.penelope-ports]
path = "../crates/penelope-ports"

[dependencies.penelope-intent]
path = "../crates/penelope-intent"

[[bin]]
name = "fuzz_identifiers"
path = "fuzz_targets/fuzz_identifiers.rs"
test = false
doc = false

[[bin]]
name = "fuzz_dtos"
path = "fuzz_targets/fuzz_dtos.rs"
test = false
doc = false

[[bin]]
name = "fuzz_linear_engine"
path = "fuzz_targets/fuzz_linear_engine.rs"
test = false
doc = false

[[bin]]
name = "fuzz_statechronicle_correlation"
path = "fuzz_targets/fuzz_statechronicle_correlation.rs"
test = false
doc = false

[[bin]]
name = "fuzz_atomic_process_commit"
path = "fuzz_targets/fuzz_atomic_process_commit.rs"
test = false
doc = false

[[bin]]
name = "fuzz_canonical_reconciliation"
path = "fuzz_targets/fuzz_canonical_reconciliation.rs"
test = false
doc = false

[[bin]]
name = "fuzz_manual_review_lifecycle"
path = "fuzz_targets/fuzz_manual_review_lifecycle.rs"
test = false
doc = false

[[bin]]
name = "fuzz_process_input_parse"
path = "fuzz_targets/fuzz_process_input_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_process_control_ports"
path = "fuzz_targets/fuzz_process_control_ports.rs"
test = false
doc = false
