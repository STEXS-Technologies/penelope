name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Stable verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-layer-boundaries.sh
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --all-features --locked --exclude penelope-fuzz
      - run: cargo clippy --workspace --all-targets --all-features --locked --exclude penelope-fuzz -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --all-features --locked --exclude penelope-fuzz
      - run: cargo bench -p penelope-executor --bench linear_saga --locked
      - run: cargo bench -p penelope-executor --bench parallel_linear_saga --locked
      - run: cargo run -p penelope --example trade_v1 --locked
      - run: cargo run -p penelope --example trade_compensation_v1 --locked
      - run: cargo run -p penelope --example trade_retry_timer_v1 --locked
      - run: cargo run -p penelope --example trade_manual_review_v1 --locked
      - run: cargo run -p penelope --example trade_competing_lock_v1 --locked

  fuzz:
    name: Bounded fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: PENELOPE_FUZZ_RUNS=1000 ./scripts/run_bounded_fuzz.sh

  supply-chain:
    name: Supply-chain verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo install cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check advisories bans licenses sources

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
