name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Stable verification
    env:
      RUSTUP_TOOLCHAIN: stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: ./scripts/check-action-pins.sh
      - run: ./scripts/check-layer-boundaries.sh
      - run: ./scripts/test-layer-boundaries.sh
      - run: ./scripts/test-chaos-runners.sh
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 scripts/publish-order.py --emit
      - run: cargo fmt --all --check
      - run: cargo check -p penelope-core --no-default-features --locked
      - run: cargo test --workspace --all-targets --all-features --locked --exclude penelope-fuzz
      - run: cargo test --workspace --doc --all-features --locked --exclude penelope-fuzz
      - run: cargo clippy --workspace --all-targets --all-features --locked --exclude penelope-fuzz -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --all-features --locked --exclude penelope-fuzz
      - run: cargo bench -p penelope-executor --bench linear_saga --locked
      - run: cargo bench -p penelope-executor --bench parallel_linear_saga --locked
      - run: cargo run -p penelope --example trade --locked
      - run: cargo run -p penelope --example trade_compensation --locked
      - run: cargo run -p penelope --example trade_retry_timer --locked
      - run: cargo run -p penelope --example trade_manual_review --locked
      - run: cargo run -p penelope --example trade_competing_lock --locked
      - run: cargo run -p penelope-executor --example recoverable_task --locked
      - run: ./scripts/run-executor-saga-example.sh
      - run: ./scripts/run-supervised-saga-example.sh

  statechronicle-conformance:
    name: Optional StateChronicle signed-event conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: STEXS-Technologies/statechronicle
          ref: ae3d94bc22c7835eaa3fdcd766e3c117929c12bb
          path: target/statechronicle-upstream
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: python3 scripts/run-statechronicle-conformance.py target/statechronicle-upstream

  msrv:
    name: Minimum supported Rust
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22 # 1.85.0
      - run: rustc --version
      - run: cargo test --workspace --all-targets --all-features --locked --exclude penelope-fuzz

  no-std:
    name: Allocation-free portable core
    env:
      RUSTUP_TOOLCHAIN: stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: riscv32imafc-unknown-none-elf
      - run: rustc --version
      - run: cargo check -p penelope-core --no-default-features --target riscv32imafc-unknown-none-elf --locked
      - run: cargo check -p penelope-core --features serde --target riscv32imafc-unknown-none-elf --locked

  fuzz:
    name: Bounded fuzzing
    env:
      RUSTUP_TOOLCHAIN: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo install cargo-fuzz --locked
      - run: PENELOPE_FUZZ_RUNS=1000 ./scripts/run_bounded_fuzz.sh

  supply-chain:
    name: Supply-chain verification
    env:
      RUSTUP_TOOLCHAIN: stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo install cargo-audit --locked
      - run: cargo install cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check advisories bans licenses sources

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history for obvious secrets
        run: |
          ! git grep -n -I -E 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' $(git rev-list --all)
