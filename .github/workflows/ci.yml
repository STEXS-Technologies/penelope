name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Stable verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-layer-boundaries.sh
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --all-features --locked --exclude penelope-fuzz
      - run: cargo clippy --workspace --all-targets --all-features --locked --exclude penelope-fuzz -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --all-features --locked --exclude penelope-fuzz
      - run: cargo bench -p penelope-executor --bench linear_saga --locked
      - run: cargo run -p penelope --example trade_v1 --locked
      - run: cargo run -p penelope --example trade_compensation_v1 --locked

  fuzz:
    name: Bounded fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run fuzz_identifiers -- -runs=1000
      - run: cargo +nightly fuzz run fuzz_versioned_dtos -- -runs=1000
      - run: cargo +nightly fuzz run fuzz_linear_engine -- -runs=1000
      - run: cargo +nightly fuzz run fuzz_statechronicle_correlation -- -runs=1000
      - run: cargo +nightly fuzz run fuzz_atomic_process_commit -- -runs=1000
      - run: cargo +nightly fuzz run fuzz_canonical_reconciliation -- -runs=1000
      - run: cargo +nightly fuzz run fuzz_manual_review_lifecycle -- -runs=1000
      - run: cargo +nightly fuzz run fuzz_process_input_parse -- -runs=1000
      - run: cargo +nightly fuzz run fuzz_process_control_ports -- -runs=1000
