name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the 0.1.0 crates to crates.io"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: ./scripts/check-action-pins.sh
      - run: ./scripts/check-layer-boundaries.sh
      - run: python3 scripts/publish-order.py --emit
      - name: Verify tagged commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD
      - name: Require a release tag for manual publishing
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = tag
      - name: Verify release tag matches package version
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME#v}" = "$(cargo pkgid -p penelope | sed -E 's/.*@//')"
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --all-features --locked --exclude penelope-fuzz
      - run: cargo clippy --workspace --all-targets --all-features --locked --exclude penelope-fuzz -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --all-features --locked --exclude penelope-fuzz
      - run: cargo audit
      - run: cargo deny check
      - run: ./scripts/publish-crates.sh

  publish:
    name: Publish crates.io packages
    needs: verify
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: ./scripts/publish-crates.sh --publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
