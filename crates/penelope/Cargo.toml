[package]
name = "penelope"
description = "Typed state machines, saga coordination, recoverable tasks and optional rewindable timelines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
timeline = ["dep:penelope-timeline"]

[dependencies]
penelope-timeline = { workspace = true, optional = true }
penelope-core = { workspace = true }
penelope-domain = { workspace = true }
penelope-intent = { workspace = true }
penelope-executor = { workspace = true }
penelope-ports = { workspace = true }
penelope-statechronicle = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[[example]]
name = "timeline_machine"
required-features = ["timeline"]
