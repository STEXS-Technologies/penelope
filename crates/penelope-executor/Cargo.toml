[package]
name = "penelope-executor"
description = "Penelope application boundary: deterministic decisions composed with injected ports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
penelope-core = { workspace = true }
penelope-domain = { workspace = true }
penelope-intent = { workspace = true }
penelope-ports = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
penelope-sqlite = { version = "0.3.0", path = "../penelope-sqlite" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
syn = { version = "2", features = ["full", "visit"] }
proptest = { workspace = true }
serde_json = { workspace = true }

